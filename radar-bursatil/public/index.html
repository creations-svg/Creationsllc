<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1b2d">
  <meta name="description" content="Radar, objetivos al +10 % y seguimiento de operaciones en acciones de EE. UU. desde Colombia.">
  <title>Radar Bursátil USA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".35"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".6"/><path d="M16 16 L27 9" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="2.6" fill="var(--accent)"/></svg>
      <div><strong>Radar Bursátil USA</strong><small id="marketPill" class="pill">…</small></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="bellBtn" aria-label="Notificaciones"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z" fill="currentColor"/></svg><span class="badge" id="bellBadge" hidden>0</span></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.3 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.3 2.7h4l.3-2.7a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4ZM13 15.5A3.5 3.5 0 1 1 13 8.5a3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg></button>
    </div>
  </header>

  <div id="modeBanner" class="banner" hidden></div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="inicio" class="active"><svg viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3Z" fill="currentColor"/></svg>Inicio</button>
    <button data-tab="radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12 19 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>Radar</button>
    <button data-tab="operaciones"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16V9m4 7V5m4 11v-6m4 6V7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>Operaciones</button>
    <button data-tab="simulador"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8M15 7h5v5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Simulador</button>
  </nav>

  <dialog id="dialog"><form method="dialog" id="dialogForm"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
